<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Peter's Keys &mdash; Newsletter Studio</title>

<!-- Theme bootstrap. Must run BEFORE the stylesheets so the first painted
     frame already carries the right palette; deferring this to app.js would
     show a flash of light chrome on a dark setup. Kept tiny and defensive:
     private-mode Safari throws on localStorage, and a failure here must never
     stop the app from loading. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('stpeters.keys.theme');
      var theme = (saved === 'light' || saved === 'dark') ? saved
        : (window.matchMedia &&
           window.matchMedia('(prefers-color-scheme: dark)').matches
             ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/paper.css">
<link rel="stylesheet" href="assets/css/print.css" media="print">
</head>
<body>

<div id="app">

  <!-- ===================================================================
       Toolbar — one floating bar holding document actions, text formatting,
       zoom and page navigation.
       =================================================================== -->
  <header id="toolbar" role="toolbar" aria-label="Newsletter tools">

    <div class="tb-group tb-brand">
      <span class="tb-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path d="M12 21s-7.5-4.7-7.5-10A4.5 4.5 0 0 1 12 8.4a4.5 4.5 0 0 1 7.5 2.6c0 5.3-7.5 10-7.5 10Z" fill="#a4243b"/>
          <path d="M11 4h2v3.2h2.4v2H13V16h-2V9.2H8.6v-2H11V4Z" fill="#fff"/>
        </svg>
      </span>
      <span class="tb-title">St. Peter&rsquo;s Keys</span>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button type="button" class="tb-btn tb-btn--primary" data-act="save"
              title="Save newsletter to a file (Ctrl/Cmd+S)">Save</button>
      <button type="button" class="tb-btn" data-act="load"
              title="Load a saved newsletter">Load</button>
      <button type="button" class="tb-btn" data-act="pdf"
              title="Print or export to PDF (Ctrl/Cmd+P)">PDF</button>
      <input type="file" id="load-input" accept=".json,application/json" hidden>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" id="format-group" aria-label="Text formatting">
      <button type="button" class="tb-btn tb-btn--icon" data-fmt="bold"
              title="Bold (Ctrl/Cmd+B)"><b>B</b></button>
      <button type="button" class="tb-btn tb-btn--icon" data-fmt="italic"
              title="Italic (Ctrl/Cmd+I)"><i>I</i></button>
      <button type="button" class="tb-btn tb-btn--icon" data-fmt="underline"
              title="Underline (Ctrl/Cmd+U)"><u>U</u></button>

      <select class="tb-select" data-fmt="fontName" aria-label="Font">
        <option value="">Font</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Georgia">Georgia</option>
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Courier New">Courier New</option>
        <option value="Impact">Impact</option>
      </select>

      <select class="tb-select" data-fmt="fontSize" aria-label="Text size">
        <option value="">Size</option>
        <option value="1">Smallest</option>
        <option value="2">Small</option>
        <option value="3">Normal</option>
        <option value="4">Large</option>
        <option value="5">Larger</option>
        <option value="6">Huge</option>
        <option value="7">Maximum</option>
      </select>

      <button type="button" class="tb-btn tb-btn--icon" data-fmt="justifyLeft"
              title="Align left" aria-label="Align left">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="currentColor"><rect x="2" y="3" width="12" height="1.6"/><rect x="2" y="6.5" width="8" height="1.6"/><rect x="2" y="10" width="11" height="1.6"/></g></svg>
      </button>
      <button type="button" class="tb-btn tb-btn--icon" data-fmt="justifyCenter"
              title="Align centre" aria-label="Align centre">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="currentColor"><rect x="2" y="3" width="12" height="1.6"/><rect x="4" y="6.5" width="8" height="1.6"/><rect x="2.5" y="10" width="11" height="1.6"/></g></svg>
      </button>
      <button type="button" class="tb-btn tb-btn--icon" data-fmt="justifyRight"
              title="Align right" aria-label="Align right">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="currentColor"><rect x="2" y="3" width="12" height="1.6"/><rect x="6" y="6.5" width="8" height="1.6"/><rect x="3" y="10" width="11" height="1.6"/></g></svg>
      </button>
      <button type="button" class="tb-btn tb-btn--icon" data-fmt="justifyFull"
              title="Justify" aria-label="Justify">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="currentColor"><rect x="2" y="3" width="12" height="1.6"/><rect x="2" y="6.5" width="12" height="1.6"/><rect x="2" y="10" width="12" height="1.6"/></g></svg>
      </button>

      <button type="button" class="tb-btn tb-btn--icon" data-fmt="insertUnorderedList"
              title="Bulleted list" aria-label="Bulleted list">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="4" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="3" cy="12" r="1.3"/><rect x="6" y="3.2" width="8" height="1.5"/><rect x="6" y="7.2" width="8" height="1.5"/><rect x="6" y="11.2" width="8" height="1.5"/></g></svg>
      </button>
      <button type="button" class="tb-btn tb-btn--icon" data-fmt="removeFormat"
              title="Clear formatting" aria-label="Clear formatting">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="currentColor"><path d="M5.6 3h7.2v1.7H9.9L7.8 13H5.9l2.1-8.3H5.6V3Z"/><rect x="1.6" y="7.2" width="5.2" height="1.4" transform="rotate(45 4.2 7.9)"/></g></svg>
      </button>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-group">
      <!-- Deliberately NOT aria-pressed: the label already names the action
           ("Switch to dark theme"), so a pressed state would both contradict
           it for screen readers and render the button permanently highlighted. -->
      <button type="button" class="tb-btn tb-btn--icon tb-btn--theme"
              data-act="theme"
              title="Switch to dark theme" aria-label="Switch to dark theme">
        <svg class="tb-ico-moon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <path fill="currentColor" d="M9.6 1.4a6.6 6.6 0 1 0 5 8.8 5.4 5.4 0 0 1-5-8.8Z"/>
        </svg>
        <svg class="tb-ico-sun" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <g fill="currentColor">
            <circle cx="8" cy="8" r="3.1"/>
            <path d="M8 .8v2.1M8 13.1v2.1M.8 8h2.1M13.1 8h2.1M2.9 2.9l1.5 1.5M11.6 11.6l1.5 1.5M13.1 2.9l-1.5 1.5M4.4 11.6l-1.5 1.5"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" id="zoom-group" aria-label="Zoom">
      <button type="button" class="tb-btn tb-btn--icon" data-act="zoom-out"
              title="Zoom out">&minus;</button>
      <button type="button" class="tb-btn tb-btn--quiet" data-act="zoom-fit"
              title="Fit the whole page in view"><span id="zoom-label">Fit</span></button>
      <button type="button" class="tb-btn tb-btn--icon" data-act="zoom-in"
              title="Zoom in">+</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" id="pager" aria-label="Pages">
      <button type="button" class="tb-btn tb-btn--icon" data-act="prev"
              title="Previous page (Alt+Left)">&larr;</button>
      <span class="tb-pageinfo" id="page-indicator">1 / 4</span>
      <button type="button" class="tb-btn tb-btn--icon" data-act="next"
              title="Next page (Alt+Right)">&rarr;</button>
    </div>
  </header>

  <!-- =================================================================== -->
  <main id="workspace">

    <aside id="editor-pane" aria-label="Newsletter content">
      <div id="editor-scroll"><!-- built by editor.js --></div>
    </aside>

    <div id="rail-resizer" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="Resize the editor panel"></div>

    <section id="preview-pane" aria-label="Preview">
      <div id="stage-viewport">
        <div id="stage-sizer">
          <div id="page-stage"><!-- .paper pages built by render.js --></div>
        </div>
      </div>
      <nav id="thumb-rail" aria-label="Go to page"><!-- built by app.js --></nav>
    </section>

  </main>
</div>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <p style="padding:2rem;font:16px system-ui">
    St. Peter&rsquo;s Keys needs JavaScript enabled to build your newsletter.
  </p>
</noscript>

<!-- Load order matters; see docs/SPEC.md §0. Classic scripts only so the app
     also works when opened directly from disk over file:// -->
<script src="assets/js/state.js"></script>
<script src="assets/js/fit.js"></script>
<script src="assets/js/flip.js"></script>
<script src="assets/js/calendar.js"></script>
<script src="assets/js/slips.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
